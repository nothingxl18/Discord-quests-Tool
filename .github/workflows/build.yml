name: Build GameSpoof Studio

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Unzip project
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, zipfile
          zips = sorted(glob.glob('**/*.zip', recursive=True))
          if not zips:
              raise SystemExit('No .zip file found in the repository')
          print('Using', zips[0])
          zipfile.ZipFile(zips[0]).extractall('_build')
          pk = [p for p in glob.glob('_build/**/package.json', recursive=True) if 'node_modules' not in p]
          if not pk:
              raise SystemExit('package.json not found inside the zip')
          pk.sort(key=len)
          proj = os.path.dirname(pk[0]).replace('\\', '/')
          print('Project dir:', proj)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('PROJECT_DIR=%s\n' % proj)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.PROJECT_DIR }}/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Generate app icons
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx tauri icon app-icon.png

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('GameSpoof Studio {0}', github.ref_name) || '' }}
          releaseBody: "Download the Windows installer/exe or the macOS .dmg below."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GameSpoofStudio-windows
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/src-tauri/target/release/gamespoof-studio.exe
            ${{ env.PROJECT_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
            ${{ env.PROJECT_DIR }}/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GameSpoofStudio-macos
          if-no-files-found: error
          path: ${{ env.PROJECT_DIR }}/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
